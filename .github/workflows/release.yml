name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/thermoworks_cloud/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for a new version
        id: version
        run: |
          version="$(jq -r .version custom_components/thermoworks_cloud/manifest.json)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.version.outputs.new == 'true'
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        if: steps.version.outputs.new == 'true'
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        if: steps.version.outputs.new == 'true'
        run: python -m pytest -q
      - name: Create release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
