# Creates a tag and GitHub release whenever a new version lands on main, so that merging a version
# bump PR is the whole release. The version in manifest.json is the source of truth: a release is
# due when that version has no tag yet.
name: Release

on:
  # Only commits that touch the manifest can change the version, so nothing runs for the rest.
  push:
    branches: [main]
    paths:
      - custom_components/thermoworks_cloud/manifest.json

jobs:
  # A release must never come from a commit that failed its tests. This uses the Tests workflow
  # itself so the two cannot drift apart. Waiting on the separate run that Tests starts for this
  # push is not possible with this trigger, so the tests run twice on version bump commits.
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release the manifest version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version custom_components/thermoworks_cloud/manifest.json)"

          # The manifest also changes for other reasons, such as a dependency update.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "$tag already exists, nothing to release"
            exit 0
          fi

          # Notes are generated from the merged PRs. Edit the release afterwards if it needs more.
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes
