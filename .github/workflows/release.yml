# Creates a GitHub release when a version tag is pushed. To release, merge a PR that bumps the
# version in manifest.json, then tag the merge commit with that version, such as v0.2.1.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # A release must never come from a commit that failed its tests. This uses the Tests workflow
  # itself so the two cannot drift apart. Tests also starts its own run for the tag, and a workflow
  # triggered by a push cannot wait on that run, so the tests run twice for each release.
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the manifest version
        run: |
          # HACS shows the release tag, while Home Assistant reports the manifest version. Fail
          # here rather than publish a release where the two disagree.
          manifest_tag="v$(jq -r .version custom_components/thermoworks_cloud/manifest.json)"
          if [ "$GITHUB_REF_NAME" != "$manifest_tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest_tag"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Notes are generated from the merged PRs. Edit the release afterwards if it needs more.
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
